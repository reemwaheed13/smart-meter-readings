# Single source of settings for the project. Nothing is hard-coded elsewhere:
# every script reads this file through common.load_config().

data:
  dataset: "London Smartmeter (Low Carbon London), half-hourly, 2013"
  year: 2013
  tariff: Std                    # standard tariff only (ToU houses are excluded)
  readings_per_day: 48           # half-hourly
  max_missing_fraction: 0.05     # drop houses missing more than 5% of the year
  max_fill_gap_readings: 4       # linear-fill gaps of at most 2 h (4 readings)
  drop_windows_with_gaps: true   # windows that still have gaps after filling are dropped
  window_length: 96
  input_length: 48
  output_length: 48
  window_stride_days: 1          # one new window per day
  split:                         # split by the window's target date
    train: 0.64
    val: 0.16
    test: 0.20
  drop_boundary_windows: true    # drop windows whose readings cross a split boundary
  attacker_pool_size: 500        # houses held by the attacker, disjoint from the neighbourhoods
  raw_dir: data/raw              # Kaggle informations_households.csv + halfhourly_dataset/ (gitignored)
  processed_file: data/processed/clean_2013.npz   # written by `python data_real.py prepare` (gitignored);
                                 # env SMART_METER_PROCESSED overrides it (e.g. the copy on Drive in Colab)
  scaling:
    method: minmax               # scale to 0-1
    fit_on: attacker_pool        # min/max are fitted on the attacker pool only

experiment:
  levels: [1, 2, 3]              # 1 = no protection, 2 = local DP, 3 = distributed DP + SecAgg+
  eps:
    level2: [1, 8]
    level3: [1, 8, null]         # null = SecAgg+ with no noise
  n: [5, 10, 20]                 # houses per neighbourhood
  neighbourhoods_k: [0, 1, 2]    # neighbourhood index for each n
  attacked_rounds: ["1", "T/2", "T"]
  windows_per_round: 4           # windows per house per round (one local FedSGD step)
  clients_per_round: all         # every house takes part in every round

# Left null until the calibration run fills them in. Do not hand-edit them before then.
calibration:
  lr: null
  T:                             # number of rounds, per neighbourhood size n
    5: null
    10: null
    20: null
  C: null                        # L2 clipping norm for levels 2 and 3
  # SecAgg+ clipping range. It must cover the NOISE at the smallest n (5) and eps = 1, not just the
  # update size: each house's noise share has std sigma/sqrt(n) (about 2.17 at C = 1, n = 5, eps = 1).
  # The pre-run check (train.settings.check_clipping_range) enforces this: a level-3 run refuses to
  # start if n*T*P*2*Phi(-clipping_range/(sigma/sqrt(n))) > 0.01. Doubling clipping_range doubles
  # the quantisation step (2*clipping_range/2**22).
  clipping_range: null

# How train/calibrate.py picks the calibration values above (README, "Calibration"). Every choice
# uses val MSE on the val split, never test. train/freeze_calibration.py then writes the chosen values
# into calibration and dp.sigma.
calibration_procedure:
  level: 1                       # all calibration runs are level 1 (no noise)
  nb: 0                          # neighbourhood index of every calibration run
  lr:
    grid: [0.01, 0.03, 0.1, 0.3, 1.0]
    n: 20
    rounds: 200
    final_rounds: 10             # final val MSE = mean over the last 10 rounds (191-200)
    # If the pick is the lowest (highest) value tried, run the next value below (above) and pick
    # again, at most max_extensions times in all. at_grid_edge is recorded if it is still at the edge.
    extend_below: [0.003, 0.001]
    extend_above: [3.0, 10.0]
    max_extensions: 2
  T:
    max_rounds: 1000             # one run per n at the chosen lr; T[n] = max_rounds is kept (hit_cap)
    window: 50                   # T[n] = first t with best-so-far val MSE improving < 1% over t..t+50
    min_improvement: 0.01
  # C = median per-house update L2 norm over the T runs' rounds 1..T[n] (logs/<run>_norms.csv).
  # clipping_range = min_clipping_range(min n, T[min n], P, sigma[min eps]) + C, rounded up to 2
  # significant figures, then checked for every (n, eps) of level 3 with its own T[n].

dp:
  delta: 1.0e-5
  # Per-round Gaussian noise std for each eps. Left null until C is known, then computed with
  # common.sigma_for(eps, C, delta). eps = null (level 3, no noise) always means sigma = 0.
  sigma:
    1: null
    8: null

secaggplus:
  # num_shares = 5, not 4: flwr 1.45.0 bumps even share counts to odd, and 4 crashes the clients.
  # (SecAggPlusWorkflow.setup_stage turns an even num_shares != n into num_shares+1 for the neighbour
  # ring AFTER it has sent the even value to the clients, which then crash with an IndexError in
  # secaggplus_mod._share_keys. 5 is what Flower itself would use for 4.)
  num_shares: 5
  reconstruction_threshold: 3    # unchanged
  clipping_range: null           # taken from calibration.clipping_range
  # Quantisation and modulus are left at the Flower defaults (flwr==1.45.0,
  # flwr.server.workflow.SecAggPlusWorkflow):
  #   quantization_range = 4194304      (2**22)
  #   modulus_range      = 4294967296   (2**32)
  #   max_weight         = 1000.0
  #   clipping_range     = 8.0          (overridden by the calibrated value above)
  quantization_range: null       # null = Flower default
  modulus_range: null            # null = Flower default

simulation:
  # Flower simulation (flwr.simulation.run_simulation, Ray backend).
  client_num_cpus: 2             # Ray CPUs per client actor (Flower's default)
  # num_examples every client reports; identical for all, so no client counts more. It equals
  # SecAgg+'s default max_weight (1000.0) on purpose: SecAgg+ multiplies each update by
  # num_examples/max_weight before clipping and quantising it, so with this value that factor is
  # exactly 1. The quantisation step is then 2*clipping_range/2**22, and SecAgg+ clips at exactly
  # clipping_range. (With weight 1 the factor would be ~0.001: about 1000x coarser quantisation.)
  # FedSGD ignores the value beyond checking that all clients report the same one.
  client_weight: 1000

paths:                           # relative to the repository root
  recordings: recordings         # attack recordings (gitignored; shared Drive)
  logs: logs                     # per-round CSV logs and test error (gitignored)

seeds:
  # run_seed = 1000*n + 10*k   (implemented in common.run_seed)
  # The houses depend only on (n, k). run_seed sets the model init, the per-round dates and
  # the DP noise. The same run_seed is used at every level.
  run_seed_formula: "1000*n + 10*k"

attacks:
  # TS-Inverse (Meijer et al. 2025), ported from github.com/Capsar/ts-inverse (CC BY-SA 4.0) in
  # attacks/ts_inverse.py. Values are from their code (notebooks/05_* and src/ts_inverse/workers/*)
  # unless marked. Fixed: there is no lambda tuning step.
  ts_inverse:
    gradient_loss: l1              # sum over parameters of |fake gradient - observed| (their "l1")
    optimizer: adam
    lr: 0.01                       # their optimization_learning_rate
    # Steps per attack = base_steps * windows * step_multiplier, as in their code
    # (base_num_attack_steps * batch_size * _attack_step_multiplier): 5000 for 1 window, 20000 for 4.
    # "windows" is the number of fake windows optimised together (4 per house; 4n at level 3).
    base_steps: 500
    step_multiplier: 10
    lr_decay_factor: 0.1           # ReduceLROnPlateau on the loss ("on_plateau_10")
    lr_patience_divisor: 10        # patience = steps // 10
    sign_input_grads: true         # their grad_signs_for_inputs (targets: false)
    clamp_every: 2                 # their after_effect "clamp_2": clamp to [0, 1] every 2nd step
    restarts: 1                    # their code has none; kept at 1 (lowest gradient loss wins if > 1)
    periodicity_weight: 0.5        # lambda_P: the paper's London best (Table VI)
    trend_weight: 0.5              # lambda_T: the paper's London best (Table VII)
    bounds_weight_inputs: 1.0      # lambda_Q^obs: from their code (reg_combinations notebook)
    bounds_weight_targets: 0.1     # lambda_Q^tar: from their code
    inversion_model:               # gradient -> quantiles (their ImprovedGradToInputNN_Quantile)
      enabled: true                # on everywhere, including the grid (--no-inversion-model is for tests only)
      hidden: [768, 512]
      dropout: 0.05
      quantiles: [0.1, 0.3, 0.7, 0.9]
      epochs: 75
      batch_size: 32               # aux samples per training batch (their attack_batch_size)
      lr: 0.001                    # AdamW
      lr_decay_factor: 0.1         # ReduceLROnPlateau on the held-out aux loss
      lr_patience_divisor: 10      # patience = epochs // 10
      val_fraction: 0.1            # ours: held-out share of the aux samples (they used a separate split)
    aux_samples: 4096              # ours: attacker-pool samples (attacks/aux_gradients.py)
  learned_inverter:                # attacks/learned_inverter.py (ours). Training settings = TS-Inverse's
                                   # inversion model; no other tuning.
    aux_samples: 4096              # the same aux set as TS-Inverse (attacks/aux_gradients.py, shared cache)
    blind: same_date               # each output slot starts from eval.baseline's guess for its date
    hidden: [768, 512]             # residual MLP trunk, ReLU, batch norm
    dropout: 0.05
    epochs: 75
    batch_size: 32
    lr: 0.001                      # AdamW
    lr_decay_factor: 0.1           # ReduceLROnPlateau on the held-out loss
    lr_patience_divisor: 10        # patience = epochs // 10
    val_fraction: 0.1              # held-out share of the aux set; picks the best epoch
  reproduce:                       # attacks/reproduce_ts_inverse.py (batch-1 reproduction gate)
    seeds: [10, 43, 28, 80, 71]    # their Table II seeds
    # Table II, London Smartmeter, FCN, batch 1, TS-Inverse: sMAPE (mean over the 5 seeds).
    paper_fcn_london_b1: {input_smape: 6.3e-06, target_smape: 2.5e-06}

# Level-1 gate (eval/gate_level1.py, notebooks/gate_level1.ipynb): must PASS before the full grid.
gate:
  # (a) Reproduction: the table2_config row of attacks/reproduce/reproduction.json passes if its mean input AND
  # target sMAPE (paper scale, 0-1) are each at most repro_factor x Table II (attacks.reproduce.paper_fcn_london_b1).
  # (b) Inverter vs blind (no setting): mean paired (blind - inverter) sMAPE over every (recording, matched
  # house-window) of the 27 level-1 recordings must exceed 2 standard errors.
  repro_factor: 10
